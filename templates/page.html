<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="icon" href="{{base}}assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{base}}assets/site.css">
  <script type="module" src="{{base}}assets/app.mjs"></script>
</head>
<body data-page="{{page}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{base}}" aria-label="U1 StartHere home"><img src="{{base}}assets/app-icon.svg" width="36" height="36" alt=""><span>U1 <strong>StartHere</strong><small>A community field guide</small></span></a>
      <nav aria-label="Main navigation">
        <a href="{{base}}start/" {{active-start}}>Startup track</a>
        <a href="{{base}}plan/" {{active-plan}}>What’s next?</a>
        <a href="{{base}}catalog/" {{active-catalog}}>Catalog</a>
        <a href="{{base}}fixes/" {{active-fixes}}>Fixes</a>
      </nav>
    </div>
  </header>
  <main id="main" class="site-main" tabindex="-1">{{content}}</main>
  <footer class="site-footer">
    <div><a class="footer-brand" href="{{base}}">U1 StartHere</a><p>An independent community guide. Not affiliated with Snapmaker.</p></div>
    <div class="footer-links"><a href="https://github.com/KellenWat/u1-starthere">Project and sources</a><a href="{{base}}data/">Open data</a><a href="{{base}}data/LICENSE.md">Data: CC BY 4.0</a><a href="{{base}}LICENSE">Code: MIT</a></div>
  </footer>
</body>
</html>
