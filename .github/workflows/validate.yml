name: Validate curated data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependency (no npm)
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalog, fixes, phases and journey JSON with relationships
        run: python scripts/validate.py
      - name: Check seed integrity and validator rejection cases
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check planner personas, symptom rankings, connected routes and views (no npm)
        run: node --test tests/*.test.mjs
      - name: Ensure committed pages match their JSON source
        run: node scripts/render.mjs --check
